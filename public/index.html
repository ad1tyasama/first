<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Indoor Navigation</title>
    <!-- Include AR.js or A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Navigation arrow -->
      <a-entity
            geometry="primitive: cone; height: 0.5; radius-bottom: 0.2"
            material="color: red"
            position="0 0 0"
            rotation="90 0 0"
            scale="0.5 0.5 0.5"
        ></a-entity>
  
      <!-- Waypoints -->
      <a-entity gps-entity-place="latitude: YOUR_LAT; longitude: YOUR_LON">
        <a-box color="yellow" depth="1" height="1" width="1"></a-box>
      </a-entity>
  
      <!-- Camera -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <a-box position="0 0.5 -3" rotation="0 45 0" color="#4CC3D9" 
       event-set__enter="_event: mouseenter; color: red"
       event-set__leave="_event: mouseleave; color: #4CC3D9"
       onclick="alert('You clicked the box!')">
</a-box>

  </body>
  
</html>

<script>
    const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.BoxGeometry();
const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onMouseMove(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function animate() {
    requestAnimationFrame(animate);

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(scene.children);
    for (let i = 0; i < intersects.length; i++) {
        intersects[i].object.material.color.set(0xff0000);
    }

    renderer.render(scene, camera);
}

window.addEventListener('mousemove', onMouseMove, false);
animate();
</script>
